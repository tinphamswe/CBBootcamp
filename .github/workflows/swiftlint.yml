name: SwiftLint

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swiftlint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      - name: Install Bundler
        run: gem install bundler

      - name: Install gems
        run: bundle install

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run Fastlane lint
        run: bundle exec fastlane ios lint
