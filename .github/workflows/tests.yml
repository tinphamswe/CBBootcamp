name: iOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      - name: Install gems
        run: bundle install

      - name: Install iOS Simulator runtime
        run: |
          runtime_directory="$RUNNER_TEMP/ios-simulator-runtime"
          mkdir -p "$runtime_directory"
          xcodebuild -downloadPlatform iOS -exportPath "$runtime_directory"
          xcodebuild -importPlatform "$runtime_directory"/*.dmg

      - name: Create simulator
        run: |
          simulator_id="$(xcrun simctl create 'CBBootcamp CI' 'iPhone 16 Pro')"
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Run tests
        run: bundle exec fastlane ios unit_test
